name: Dependabot Triage

on:
  pull_request:
    types: [opened]
  schedule:
    # Daily at 06:00 UTC — check if any security-wait PRs are past 72h
    - cron: "0 6 * * *"

permissions:
  pull-requests: write
  issues: write

jobs:
  # ─── On PR open: label + comment with eligible date ───
  label-new-pr:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Add security-wait label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const created = new Date(context.payload.pull_request.created_at);
            const eligible = new Date(created.getTime() + 72 * 60 * 60 * 1000);
            const dateStr = eligible.toISOString().split('T')[0];

            // Ensure labels exist
            for (const label of ['security-wait', 'ready-to-merge']) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'security-wait' ? 'FFA500' : '2EA44F',
                  description: label === 'security-wait'
                    ? 'Dependabot PR in 72h waiting period'
                    : 'Dependabot PR past waiting period, ready for audit',
                });
              } catch (e) {
                if (e.status !== 422) throw e;  // 422 = already exists
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['security-wait'],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `**Dependabot security triage.** Held \`security-wait\` for a 72h community-detection window before this PR becomes merge-eligible.\n\nEligible for audit after: **${dateStr}** — the \`ready-to-merge\` label is applied automatically then. **The label is the gate, not the date:** do not merge while \`security-wait\` is set.\n\n**Pre-merge audit** (a human runs this before merging):\n- File scope: manifest + lockfile only, sane diff size\n- OSV: new version carries no known vulns\n- Install hooks: no new npm \`postinstall\` / PyPI \`setup.py\` exec — the malware vector\n- Provenance: not yanked; attestation / Trusted-Publishing intact\n- Advisory: GHSA real, researcher-attributed, patched version matches\n- Regressions + breaking-change search; repo health\n- **Full local test suite + smoke on the touched path**\n\nThe audit result is posted here before merge.`,
            });

  # ─── Daily: promote past-72h PRs from security-wait → ready-to-merge ───
  promote-ready:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check and promote eligible PRs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const now = Date.now();
            const cutoff = 72 * 60 * 60 * 1000;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            for (const pr of prs) {
              if (pr.user.login !== 'dependabot[bot]') continue;

              const labels = pr.labels.map(l => l.name);
              if (!labels.includes('security-wait')) continue;
              if (labels.includes('ready-to-merge')) continue;

              const age = now - new Date(pr.created_at).getTime();
              if (age < cutoff) continue;

              // Remove security-wait, add ready-to-merge
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: 'security-wait',
              }).catch(() => {});

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['ready-to-merge'],
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `**72h waiting period passed** — label promoted to \`ready-to-merge\`.\n\nNow eligible. **Merge only after the pre-merge audit passes** (file scope · OSV · install hooks · provenance · advisory authenticity · full local test suite + smoke). The audit result is posted here before merge.\n\n**If the audit does not pass, do not merge — strip \`ready-to-merge\` and comment the finding** (HOLD / BLOCK-PATCH / REJECT; see \`DEPENDENCY_SECURITY_POLICY.md\`).`,
              });
            }
