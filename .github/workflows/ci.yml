name: CI

# Runs the test suite and the linter on every push to main and every pull request.
# The suite makes no API calls and needs no secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Any uv command fails instead of rewriting uv.lock.
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.11"

      - name: Install dependencies from the lockfile
        run: uv sync --locked --all-extras

      - name: Lint
        run: make lint

      - name: Test
        run: make test
