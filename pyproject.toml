[project]
name = "scarcity-transition-sim"
version = "0.1.0"
description = "Parametric ABM of economic coordination mechanisms under post-scarcity conditions"
requires-python = ">=3.11"
dependencies = [
    "mesa[network]>=3.0",
    "pandas>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
